# Dedicated synthetic local environment; never use against production data.
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: objects
      POSTGRES_USER: objects
      POSTGRES_PASSWORD: synthetic_objects_only
    volumes: [objects_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U objects -d objects]
      interval: 3s
      timeout: 3s
      retries: 20
  init:
    build: ../../backend
    working_dir: /app
    environment: &environment
      DATABASE_URL: postgresql://objects:synthetic_objects_only@db:5432/objects
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:13031,http://127.0.0.1:13031
      NOTIFICATION_EMAIL_ENABLED: "0"
      IIKO_ENABLED: "0"
    volumes: [../../backend:/app:ro, ./prepare_synthetic.py:/acceptance/prepare_synthetic.py:ro]
    command: sh -c "python manage.py migrate --noinput && PYTHONPATH=/app python /acceptance/prepare_synthetic.py"
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: ../../backend
    environment: *environment
    volumes: [../../backend:/app:ro]
    command: python manage.py runserver 0.0.0.0:8000 --noreload
    ports: [127.0.0.1:18081:8000]
    depends_on:
      init: {condition: service_completed_successfully}
  frontend:
    image: node:24-bookworm
    working_dir: /app
    volumes: [../../frontend:/app, objects_node:/app/node_modules]
    environment:
      VITE_API_URL: http://localhost:18081/api/v1
    command: sh -c "npm ci && npm run dev"
    ports: [127.0.0.1:13031:3000]
    depends_on: [backend]
volumes:
  objects_data:
  objects_node:
